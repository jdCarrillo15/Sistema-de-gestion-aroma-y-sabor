name: Deploy to VPS

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vps

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy backend on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ secrets.VPS_APP_DIR }}
            git fetch --all
            git reset --hard origin/deploy
            cd backend
            npm install --omit=dev
            pm2 startOrReload aroma-sabor-backend
            pm2 status
          "

      - name: Deploy frontend on VPS
        if: contains(env.CHANGED_DIRS, 'frontend')
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ secrets.VPS_APP_DIR }}
            git fetch --all
            git reset --hard origin/deploy
            cd frontend
            npm ci
            npm run build
            sudo rm -rf /var/www/aroma-sabor/*
            sudo cp -r dist/* /var/www/aroma-sabor/
            sudo chown -R www-data:www-data /var/www/aroma-sabor
            sudo chmod -R 755 /var/www/aroma-sabor
            sudo systemctl reload nginx
          "
