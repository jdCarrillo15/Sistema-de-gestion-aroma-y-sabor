name: Deploy to VPS

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vps

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Detect changes since last deploy
        id: changes
        run: |
          git fetch origin deploy
          LAST_DEPLOY=$(git rev-parse origin/deploy)
          echo "Comparando cambios desde el último deploy ($LAST_DEPLOY)..."
          CHANGED_DIRS=$(git diff --name-only $LAST_DEPLOY...HEAD | cut -d/ -f1 | sort -u)
          echo "CHANGED_DIRS=$CHANGED_DIRS" >> $GITHUB_ENV
          echo "Cambios detectados en:"
          echo "$CHANGED_DIRS"

      - name: Deploy backend on VPS
        if: contains(env.CHANGED_DIRS, 'backend')
        run: |
          echo "Desplegando backend..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ secrets.VPS_APP_DIR }}
            git fetch --all
            git reset --hard origin/deploy
            cd backend
            npm install --omit=dev
            pm2 startOrReload /home/appuser/configs/ecosystem.config.cjs
            pm2 status
          "

      - name: Deploy frontend on VPS
        if: contains(env.CHANGED_DIRS, 'frontend')
        run: |
          echo "Desplegando frontend..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ secrets.VPS_APP_DIR }}
            git fetch --all
            git reset --hard origin/deploy
            cd frontend
            npm ci
            npm run build
            rm -rf /var/www/aroma-sabor/*
            cp -r dist/* /var/www/aroma-sabor/
          "
