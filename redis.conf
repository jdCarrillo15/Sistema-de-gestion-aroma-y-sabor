# Seguridad
requirepass cafe2025

# Bind a todas las interfaces (necesario para Docker)
bind 0.0.0.0  

# Persistencia de datos
appendonly yes
appendfsync everysec

# Guardar snapshots
save 900 1
save 300 10
save 60 10000

# Configuración de memoria
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Timeout de cliente inactivo (0 = sin timeout)
timeout 0

# TCP keepalive
tcp-keepalive 300

# Base de datos (por defecto 16)
databases 16